<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">ExchangeRate</a>
      <!-- ... кнопка бургера (без изменений) ... -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"></li>
          <li class="nav-item"><a class="nav-link" href="/index.html">Конвертер валют</a></li>
          <li class="nav-item"><a class="nav-link" href="/exchange.html">Курс валют</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Банки </a></li>
          <li class="nav-item"><a class="nav-link" href="/singin.html">Регистрация</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <form method="POST">
  <div class="input-group mb-3">
    <button type="submit" class="btn btn-outline-secondary">Перевести</button>
    
    <select name="from_currency" class="btn btn-outline-secondary">
      {% for item in items %}
      <option value="{{ item }}" {% if item == selected_from %}selected{% endif %}>
        {{ item }}
      </option>
      {% endfor %}
    </select>

    <!-- Сохраняем введенную сумму в атрибуте value -->
    <input type="number" step="0.01" name="source_amount" class="form-control" 
           value="{{ request.form.get('source_amount', '') }}" placeholder="Сумма" required>
  </div>

  <div class="input-group">
    <input type="text" class="form-control" value="{{ result }}" readonly placeholder="Результат">
    
    <select name="to_currency" class="btn btn-outline-secondary">
      {% for item in items %}
      <option value="{{ item }}" {% if item == selected_to %}selected{% endif %}>
        {{ item }}
      </option>
      {% endfor %}
    </select>
  </div>
</form>
  </div>

  <div class="scrollspy-example bg-body-tertiary p-3 rounded-2 mt-3" tabindex="0">
    <!-- Пустой блок как в оригинале -->
  </div>
</body>

</html>
