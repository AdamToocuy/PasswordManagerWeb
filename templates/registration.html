{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <h2>Создание аккаунта</h2>
    <br>

    <form method="POST">
        <!-- НОВОЕ ПОЛЕ: Юзернейм -->
        <div class="mb-3">
            <label for="usernameInput" class="form-label">Имя пользователя (Username)</label>
            <input type="text" class="form-control" name="username" id="usernameInput" required>
        </div>

        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" id="exampleInputEmail1" required>
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" name="password" id="exampleInputPassword1" required>
        </div>

        <div class="mb-3">
            <label for="exampleInputPassword2" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" name="password_confirm" id="exampleInputPassword2" required>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    
    <ul class="nav mt-3">
        <li class="nav-item"><a class="nav-link px-0" href="/signin.html">Уже есть аккаунт? Авторизуйтесь.</a></li>
    </ul>
{% endblock %}
