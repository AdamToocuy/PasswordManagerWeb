<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<!DOCTYPE html>
<html lang="ru" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель курсов валют</title>
    
    <!-- Подключаем CSS Bootstrap для шапки -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Подключаем ApexCharts через CDN -->
    <script src="https://jsdelivr.net"></script>

    <style>
        :root {
            --bg-color: #0f172a;       /* Темный фон страницы */
            --card-bg: #1e293b;        /* Цвет карточек */
            --text-primary: #f8fafc;   /* Основной светлый текст */
            --text-secondary: #94a3b8; /* Второстепенный текст */
            --accent-color: #38bdf8;   /* Неоново-голубой акцент */
            --border-color: #334155;   /* Границы */
            --positive-color: #4ade80; /* Зеленый для роста */
            --gap: 1.5rem;
            --navbar-height: 56px;     /* Высота верхней шапки */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column; /* Изменили на column для верхней шапки */
            min-height: 100vh;
        }

        /* Кастомизация Bootstrap Navbar под темную тему */
        .navbar {
            background-color: var(--card-bg) !important;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1050; /* Выше бокового меню */
            height: var(--navbar-height);
        }

        .navbar-brand, .nav-link {
            color: var(--text-primary) !important;
        }

        .nav-link:hover {
            color: var(--accent-color) !important;
        }

        .navbar-toggler {
            border-color: var(--border-color);
            background-color: var(--border-color);
        }

        /* Обёртка под шапкой */
        .app-layout {
            display: flex;
            margin-top: var(--navbar-height); /* Отступ на высоту шапки */
            flex: 1;
        }

        /* Боковое меню */
        .sidebar {
            width: 250px;
            background-color: var(--card-bg);
            border-inline-end: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            position: fixed; /* Фиксируем, чтобы прокручивался только контент */
            top: var(--navbar-height);
            bottom: 0;
            z-index: 1000;
        }

        .nav-link-sidebar {
            text-decoration: none;
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            display: block;
        }

        .nav-link-sidebar.active, .nav-link-sidebar:hover {
            background-color: #334155;
            color: var(--accent-color);
            font-weight: 600;
        }

        /* Главный контент */
        .main-content {
            flex: 1;
            padding: var(--gap);
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            margin-inline-start: 250px; /* Отступ на ширину сайдбара */
        }

        /* Шапка дашборда */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.75rem;
        }

        /* Виджет конвертера (Селекторы) */
        .controls-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            flex-wrap: wrap;
            border: 1px solid var(--border-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .form-group select {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            background-color: #0f172a;
            color: var(--text-primary);
            cursor: pointer;
            outline: none;
        }

        .form-group select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        /* Сетка дашборда */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--gap);
        }

        /* Карточки метрик */
        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
            direction: ltr;
            text-align: right;
        }

        .card-status {
            font-size: 0.875rem;
            color: var(--positive-color);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Карточка с графиком */
        .chart-card {
            grid-column: 1 / -1;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            min-height: 350px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid var(--border-color);
        }

        #chart {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
        }

        /* Стили для адаптивности */
        @media (max-width: 992px) {
            .sidebar {
                display: none; /* Скрываем сайдбар на планшетах/телефонах */
            }
            .main-content {
                margin-inline-start: 0;
            }
        }

        @media (max-width: 768px) {
            .controls-card {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ШАПКА BOOTSTRAP (Выше всего) -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" style="color: var(--accent-color) !important;">ExchangeRate</a>
            
            <!-- Кнопка бургера -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html">Конвертер валют</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="/exchange.html" style="color: var(--accent-color) !important;">Курс валют</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Банки</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основная сетка приложения -->
    <div class="app-layout">
        
        <!-- Боковое меню -->
        <aside class="sidebar">
            <nav>
                <a href="#" class="nav-link-sidebar active">Панель управления</a>
                <a href="#" class="nav-link-sidebar">Аналитика</a>
                <a href="#" class="nav-link-sidebar">Настройки</a>
            </nav>
        </aside>

        <!-- Главный контент -->
        <main class="main-content">
            <header class="header">
                <h1>Мониторинг курсов валют</h1>
                <div style="color: var(--text-secondary);">Обновлено: Сегодня</div>
            </header>

            <!-- Фильтры выбора валют -->
            <section class="controls-card">
                <div class="form-group">
                    <label for="base-currency">Базовая валюта (Base)</label>
                    <select id="base-currency">
                        {% for item in items %}
                          <option value="{{ item }}" {% if item == selected_from %}selected{% endif %}>
                            {{ item }}
                          </option>
                          {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="target-currency">Целевая валюта (Target)</label>
                    <select id="target-currency">
                        {% for item in items %}
                          <option value="{{ item }}" {% if item == selected_from %}selected{% endif %}>
                            {{ item }}
                          </option>
                          {% endfor %}
                    </select>
                </div>
            </section>

            <!-- Сетка дашборда -->
            <div class="dashboard-grid">
                <!-- Карточка 1 -->
                <div class="card">
                    <div class="card-title" id="rate-title">Текущий курс (USD / EUR)</div>
                    <div class="card-value" id="current-val">0.9245</div>
                    <div class="card-status">
                        <span>▲ +0.23%</span>
                        <span>за сегодня</span>
                    </div>
                </div>

                <!-- Карточка 2 -->
                <div class="card">
                    <div class="card-title">Максимум сегодня</div>
                    <div class="card-value" id="high-val">0.9280</div>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">Пик за 24ч</div>
                </div>

                <!-- Карточка 3 -->
                <div class="card">
                    <div class="card-title">Минимум сегодня</div>
                    <div class="card-value" id="low-val">0.9195</div>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">Минимум за 24ч</div>
                </div>

                <!-- Карточка графика -->
                <div class="chart-card">
                    <div style="font-weight: 600;">История движения курса</div>
                    <div id="chart"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Подключаем JS Bootstrap для работы бургера -->
    <script src="https://jsdelivr.net"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const chartOptions = {
                series: [{
                    name: 'Курс',
                    data: [0.9210, 0.9225, 0.9200, 0.9245, 0.9230, 0.9260, 0.9245]
                }],
                chart: {
                    type: 'area',
                    height: 300,
                    rtl: true,
                    foreColor: '#94a3b8',
                    toolbar: { show: false }
                },
                colors: ['#38bdf8'],
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 2 },
                xaxis: {
                    categories: ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб']
                },
                fill: {
                    type: 'gradient',
                    gradient: {
                        shadeIntensity: 1, 
                        opacityFrom: 0.4, 
                        opacityTo: 0.05, 
                        stops:
                    }
                },
                tooltip: {
                    theme: 'dark'
                },
                grid: {
                    borderColor: '#334155'
                }
            };

            const chart = new ApexCharts(document.querySelector("#chart"), chartOptions);
            chart.render();

            const baseSelect = document.getElementById('base-currency');
            const targetSelect = document.getElementById('target-currency');
            const rateTitle = document.getElementById('rate-title');
            const currentVal = document.getElementById('current-val');
            const highVal = document.getElementById('high-val');
            const lowVal = document.getElementById('low-val');

            function updateData() {
                const base = baseSelect.value;
                const target = targetSelect.value;
                
                rateTitle.textContent = `Текущий курс (${base} / ${target})`;

                if (base === target) {
                    currentVal.textContent = "1.0000";
                    highVal.textContent = "1.0000";
                    lowVal.textContent = "1.0000";
                    chart.updateSeries([{ data: }]);
                    return;
                }

                const randomBase = Math.random() * (1.5 - 0.5) + 0.5;
                currentVal.textContent = randomBase.toFixed(4);
                highVal.textContent = (randomBase + 0.05).toFixed(4);
                lowVal.textContent = (randomBase - 0.05).toFixed(4);

                const newData = Array.from({ length: 7 }, () => 
                    parseFloat((randomBase + (Math.random() * 0.1 - 0.05)).toFixed(4))
                );
                chart.updateSeries([{ data: newData }]);
            }

            baseSelect.addEventListener('change', updateData);
            targetSelect.addEventListener('change', updateData);
        });
    </script>
</body>
</html>
</body>

</html>
