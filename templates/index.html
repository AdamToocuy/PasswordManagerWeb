<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">ExchangeRate</a>
      <!-- ... кнопка навигации ... -->
    </div>
  </nav>

  <div class="container mt-4">
    <form method="POST">
  <div class="input-group mb-3">
    <!-- Кнопка отправки формы -->
    <button type="submit" class="btn btn-outline-secondary">Перевести</button>
    
    <!-- Выпадающий список БАЗОВОЙ валюты -->
    <select name="from_currency" class="btn btn-outline-secondary">
      {% for item in items %}
      <option value="{{ item }}" {% if item == 'RUB' %}selected{% endif %}>{{ item }}</option>
      {% endfor %}
    </select>

    <!-- Поле ввода суммы -->
    <input type="number" step="0.01" name="source_amount" class="form-control" placeholder="Сумма" required>
  </div>

  <div class="input-group">
    <!-- Поле вывода результата (заполняется из Python) -->
    <input type="text" class="form-control" value="{{ result }}" readonly placeholder="Результат">
    
    <!-- Выпадающий список ЦЕЛЕВОЙ валюты -->
    <select name="to_currency" class="btn btn-outline-secondary">
      {% for item in items %}
      <option value="{{ item }}" {% if item == 'USD' %}selected{% endif %}>{{ item }}</option>
      {% endfor %}
    </select>
  </div>
</form>
  </div>

  <div class="scrollspy-example bg-body-tertiary p-3 rounded-2 mt-3" tabindex="0">
    <!-- Пустой блок как в оригинале -->
  </div>
</body>

</html>
